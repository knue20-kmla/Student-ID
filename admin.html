<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>관리자 대시보드 | 학생증 재발급 관리</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #0d1b3e;
      --navy-mid: #162347;
      --gold: #c9a84c;
      --gold-light: #e8c96a;
      --cream: #fdf9f0;
      --sidebar-bg: #0d1b3e;
      --text: #1a1a2e;
      --muted: #6b7280;
      --border: #e5e0d5;
      --success: #15803d;
      --success-bg: #dcfce7;
      --pending-bg: #fef3c7;
      --pending: #b45309;
      --red: #dc2626;
      --card-bg: #fff;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: #f4f0e8;
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Login Screen ── */
    #loginScreen {
      position: fixed;
      inset: 0;
      background: var(--navy);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
    }

    .login-card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(201,168,76,0.3);
      border-radius: 20px;
      padding: 48px 40px;
      width: 100%;
      max-width: 360px;
      text-align: center;
      backdrop-filter: blur(10px);
    }

    .login-card .emblem {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      overflow: hidden;
      margin: 0 auto 20px;
    }
    .login-card .emblem img { width: 100%; height: 100%; display: block; object-fit: cover; }

    .login-card h2 {
      font-family: 'Noto Serif KR', serif;
      color: #fff;
      font-size: 1.2rem;
      margin-bottom: 6px;
    }

    .login-card p {
      font-size: 0.8rem;
      color: rgba(255,255,255,0.5);
      margin-bottom: 28px;
    }

    .login-card input {
      width: 100%;
      padding: 13px 16px;
      border-radius: 10px;
      border: 1.5px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.08);
      color: #fff;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 1rem;
      text-align: center;
      letter-spacing: 0.2em;
      outline: none;
      margin-bottom: 12px;
      transition: border-color 0.2s;
    }

    .login-card input:focus { border-color: var(--gold); }

    .login-card button {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, var(--gold), var(--gold-light));
      color: var(--navy);
      border: none;
      border-radius: 10px;
      font-family: 'Noto Serif KR', serif;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .login-card button:hover { opacity: 0.9; }

    .login-err {
      font-size: 0.8rem;
      color: #fca5a5;
      margin-top: 10px;
      min-height: 20px;
    }

    /* ── App Layout ── */
    #app { display: none; min-height: 100vh; }
    #app.show { display: block; }

    .top-bar {
      background: var(--navy);
      padding: 0 28px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: 0 2px 12px rgba(0,0,0,0.2);
    }

    .top-bar-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .top-bar-left .logo {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      overflow: hidden;
      flex-shrink: 0;
    }
    .top-bar-left .logo img { width: 100%; height: 100%; display: block; object-fit: cover; }

    .top-bar-left h1 {
      font-family: 'Noto Serif KR', serif;
      font-size: 1rem;
      color: #fff;
      font-weight: 600;
    }

    .top-bar-left h1 span { color: var(--gold-light); }

    .top-bar-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .last-refresh {
      font-size: 0.75rem;
      color: rgba(255,255,255,0.4);
    }

    .btn-refresh {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.8);
      border-radius: 8px;
      padding: 7px 14px;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 0.8rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-refresh:hover { background: rgba(255,255,255,0.14); }

    .btn-logout {
      background: none;
      border: 1px solid rgba(255,255,255,0.2);
      color: rgba(255,255,255,0.6);
      border-radius: 8px;
      padding: 7px 14px;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 0.8rem;
      cursor: pointer;
    }

    /* ── Content ── */
    .content {
      max-width: 1200px;
      margin: 0 auto;
      padding: 28px 24px 60px;
    }

    /* ── Stats ── */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 28px;
    }

    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px 22px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    .stat-card .label {
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .stat-card .value {
      font-family: 'Noto Serif KR', serif;
      font-size: 2rem;
      font-weight: 700;
      color: var(--navy);
      line-height: 1;
    }

    .stat-card .value.gold { color: var(--gold); }
    .stat-card .value.green { color: var(--success); }

    /* ── Table section ── */
    .table-section {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.05);
      overflow: hidden;
    }

    .table-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .table-header h2 {
      font-family: 'Noto Serif KR', serif;
      font-size: 1.05rem;
      color: var(--navy);
    }

    .filter-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .filter-row select, .filter-row input {
      padding: 8px 12px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 0.82rem;
      color: var(--text);
      background: #fafaf8;
      outline: none;
      transition: border-color 0.2s;
    }

    .filter-row select:focus, .filter-row input:focus { border-color: var(--gold); }

    .table-wrap { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.875rem;
    }

    thead th {
      background: #f8f5ee;
      padding: 12px 16px;
      text-align: left;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    tbody tr {
      border-bottom: 1px solid #f5f0e8;
      transition: background 0.15s;
    }

    tbody tr:hover { background: #fdf9f2; }
    tbody tr:last-child { border-bottom: none; }

    tbody td {
      padding: 14px 16px;
      color: var(--text);
      vertical-align: middle;
    }

    td.mono {
      font-family: monospace;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 500;
      white-space: nowrap;
    }

    .badge.pending {
      background: var(--pending-bg);
      color: var(--pending);
    }

    .badge.done {
      background: var(--success-bg);
      color: var(--success);
    }

    .photo-thumb {
      width: 36px;
      height: 48px;
      object-fit: cover;
      border-radius: 4px;
      border: 1px solid var(--border);
      cursor: pointer;
    }

    .no-photo {
      width: 36px;
      height: 48px;
      background: #f0ebe0;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      color: var(--muted);
    }

    /* ── Complete button ── */
    .btn-complete {
      background: linear-gradient(135deg, #15803d, #16a34a);
      color: #fff;
      border: none;
      border-radius: 7px;
      padding: 7px 14px;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 0.78rem;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      white-space: nowrap;
    }

    .btn-complete:hover:not(:disabled) { opacity: 0.85; transform: translateY(-1px); }
    .btn-complete:disabled { background: #d1fae5; color: #6ee7b7; cursor: default; }

    .btn-complete.loading-btn {
      opacity: 0.7;
      cursor: wait;
    }

    .done-label {
      color: var(--success);
      font-size: 0.78rem;
      font-weight: 500;
    }

    .empty-state {
      text-align: center;
      padding: 64px 24px;
      color: var(--muted);
    }

    .empty-state .icon { font-size: 2.5rem; margin-bottom: 12px; }

    .loading-row td { text-align: center; padding: 48px; }

    .spinner-lg {
      width: 32px;
      height: 32px;
      border: 3px solid #e5e0d5;
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 12px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Toast ── */
    .toast-wrap {
      position: fixed;
      bottom: 28px;
      right: 28px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 200;
    }

    .toast {
      background: var(--navy);
      color: #fff;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 0.875rem;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
      border-left: 4px solid var(--gold);
      animation: slideIn 0.3s ease;
      max-width: 300px;
    }

    .toast.success { border-left-color: #4ade80; }
    .toast.error { border-left-color: #f87171; }

    @keyframes slideIn {
      from { transform: translateX(40px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    /* ── Photo Modal ── */
    .photo-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 300;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    .photo-overlay.show { opacity: 1; pointer-events: auto; }

    .photo-overlay img {
      max-width: 300px;
      max-height: 80vh;
      border-radius: 12px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.4);
    }

    .photo-overlay .close-btn {
      position: absolute;
      top: 20px; right: 20px;
      background: rgba(255,255,255,0.15);
      border: none;
      color: #fff;
      font-size: 1.5rem;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
    }

    @media (max-width: 768px) {
      .stats-row { grid-template-columns: 1fr 1fr; }
      .top-bar-right .last-refresh { display: none; }
    }

    @media (max-width: 480px) {
      .stats-row { grid-template-columns: 1fr 1fr; }
      .table-header { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>

      </div>
      <div class="stat-card">
        <div class="label">대기 중</div>
        <div class="value gold" id="statPending">—</div>
      </div>
      <div class="stat-card">
        <div class="label">제작 완료</div>
        <div class="value green" id="statDone">—</div>
      </div>
      <div class="stat-card">
        <div class="label">오늘 신청</div>
        <div class="value" id="statToday">—</div>
      </div>
    </div>

    <!-- Table -->
    <div class="table-section">
      <div class="table-header">
        <h2>신청 목록</h2>
        <div class="filter-row">
          <input type="text" id="searchInput" placeholder="이름 · 학번 검색" oninput="renderTable()" style="width:160px" />
          <select id="filterStatus" onchange="renderTable()">
            <option value="">전체 상태</option>
            <option value="대기중">대기 중</option>
            <option value="완료">완료</option>
          </select>
          <select id="filterGrade" onchange="renderTable()">
            <option value="">전체 학년</option>
            <option value="1">1학년</option>
            <option value="2">2학년</option>
            <option value="3">3학년</option>
          </select>
        </div>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>접수번호</th>
              <th>이름</th>
              <th>학번</th>
              <th>학년/반</th>
              <th>사유</th>
              <th>이메일</th>
              <th>사진</th>
              <th>신청일시</th>
              <th>상태</th>
              <th>완료처리</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr class="loading-row">
              <td colspan="10">
                <div class="spinner-lg"></div>
                <div style="font-size:0.85rem;color:#999">데이터 불러오는 중...</div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Photo Modal -->
<div class="photo-overlay" id="photoOverlay" onclick="closePhoto()">
  <button class="close-btn">✕</button>
  <img id="photoModalImg" src="" alt="학생 사진" />
</div>

<!-- Toast -->
<div class="toast-wrap" id="toastWrap"></div>

<script>
  // ── 설정 ──
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxb5215g4KksTB__0SlLqftzShcBY3Nz-wMFRYToQ3wsCH4LElnDZ1fXzSpLeTVJW-8AQ/exec';
  const ADMIN_PASSWORD  = 'minjok2024';   // ← 원하는 비밀번호로 변경

  // ── 로그인 ──
  function doLogin() {
    const pw = document.getElementById('pwInput').value;
    if (pw === ADMIN_PASSWORD) {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('app').classList.add('show');
      loadData();
      setInterval(loadData, 60000); // 1분마다 자동 갱신
    } else {
      document.getElementById('loginErr').textContent = '비밀번호가 올바르지 않습니다.';
    }
  }

  function logout() {
    location.reload();
  }

  // ── 데이터 ──
  let allData = [];

  async function loadData() {
    try {
      const res = await fetch(`${APPS_SCRIPT_URL}?action=list&t=${Date.now()}`);
      const json = await res.json();
      allData = json.data || [];
      updateStats();
      renderTable();
      document.getElementById('lastRefresh').textContent =
        '마지막 갱신: ' + new Date().toLocaleTimeString('ko-KR');
    } catch (e) {
      showToast('데이터를 불러오지 못했습니다.', 'error');
    }
  }

  function updateStats() {
    const total = allData.length;
    const done = allData.filter(r => r.status === '완료').length;
    const pending = total - done;
    const today = new Date().toLocaleDateString('ko-KR');
    const todayCount = allData.filter(r => r.timestamp && r.timestamp.startsWith(today)).length;

    document.getElementById('statTotal').textContent = total;
    document.getElementById('statPending').textContent = pending;
    document.getElementById('statDone').textContent = done;
    document.getElementById('statToday').textContent = todayCount;
  }

  function renderTable() {
    const search = document.getElementById('searchInput').value.toLowerCase();
    const statusFilter = document.getElementById('filterStatus').value;
    const gradeFilter = document.getElementById('filterGrade').value;

    let rows = allData.filter(r => {
      const matchSearch = !search || r.name?.toLowerCase().includes(search) || r.studentId?.includes(search);
      const matchStatus = !statusFilter || r.status === statusFilter;
      const matchGrade = !gradeFilter || r.grade === gradeFilter;
      return matchSearch && matchStatus && matchGrade;
    });

    const tbody = document.getElementById('tableBody');

    if (rows.length === 0) {
      tbody.innerHTML = `
        <tr><td colspan="10">
          <div class="empty-state">
            <div class="icon">📭</div>
            <div>해당하는 신청 내역이 없습니다.</div>
          </div>
        </td></tr>`;
      return;
    }

    tbody.innerHTML = rows.map((r, i) => {
      const isDone = r.status === '완료';
      const photoCell = r.photo
        ? `<img src="${r.photo}" class="photo-thumb" onclick="openPhoto('${r.photo}')" title="사진 보기" />`
        : `<div class="no-photo">없음</div>`;

      return `
        <tr>
          <td class="mono">${r.rowNum || (i+1)}</td>
          <td><strong>${r.name || ''}</strong></td>
          <td class="mono">${r.studentId || ''}</td>
          <td>${r.grade || ''}학년 ${r.classNum || ''}반</td>
          <td><span style="font-size:0.8rem">${r.reason || ''}</span></td>
          <td class="mono" style="font-size:0.8rem">${r.email || ''}</td>
          <td>${photoCell}</td>
          <td style="font-size:0.78rem;color:var(--muted);white-space:nowrap">${r.timestamp || ''}</td>
          <td>
            <span class="badge ${isDone ? 'done' : 'pending'}">
              ${isDone ? '✅ 완료' : '⏳ 대기'}
            </span>
          </td>
          <td>
            ${isDone
              ? `<span class="done-label">완료됨</span>`
              : `<button class="btn-complete" onclick="markComplete(${r.rowIndex}, this)">제작 완료 ✓</button>`
            }
          </td>
        </tr>`;
    }).join('');
  }

  // ── 완료 처리 ──
  async function markComplete(rowIndex, btn) {
    if (!confirm('이 학생의 학생증 제작 완료로 처리하고 이메일을 발송하시겠습니까?')) return;

    btn.disabled = true;
    btn.classList.add('loading-btn');
    btn.textContent = '처리 중...';

    try {
      // no-cors 모드로 POST (Apps Script CORS 제한 우회)
      await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ action: 'complete', rowIndex }),
        mode: 'no-cors',
      });

      // 2초 후 시트 데이터 다시 불러와서 완료 여부 확인
      showToast('⏳ 처리 중... 잠시 기다려 주세요.', '');
      await new Promise(r => setTimeout(r, 2500));
      await loadData();

      // 갱신된 데이터에서 해당 행이 완료인지 확인
      const row = allData.find(r => r.rowIndex === rowIndex);
      if (row && row.status === '완료') {
        showToast(`✅ 완료 처리 및 이메일 발송 완료 (${row.name})`, 'success');
      } else {
        showToast('✅ 요청을 전송했습니다. 시트에서 결과를 확인해 주세요.', 'success');
      }

    } catch (e) {
      showToast('서버 통신 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.', 'error');
      btn.disabled = false;
      btn.classList.remove('loading-btn');
      btn.textContent = '제작 완료 ✓';
    }
  }

  // ── 사진 모달 ──
  function openPhoto(src) {
    document.getElementById('photoModalImg').src = src;
    document.getElementById('photoOverlay').classList.add('show');
  }

  function closePhoto() {
    document.getElementById('photoOverlay').classList.remove('show');
  }

  // ── Toast ──
  function showToast(msg, type = '') {
    const wrap = document.getElementById('toastWrap');
    const toast = document.createElement('div');
    toast.className = 'toast ' + type;
    toast.textContent = msg;
    wrap.appendChild(toast);
    setTimeout(() => toast.remove(), 4000);
  }
</script>
</body>
</html>
